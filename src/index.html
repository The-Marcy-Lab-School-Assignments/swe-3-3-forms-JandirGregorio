<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RSVP Form</title>
</head>
<body>
  <header>
    <h1>NYC Tech Summit 2026</h1>
    <p>March 15, 2026 | 9:00 AM - 5:00 PM | Manhattan Conference Center</p>
  </header>

  <main>
    <h2>Event RSVP</h2>
    <form action="https://formspree.io/f/xdaalype" method="POST">
      <div>
        <label for="first-name">First Name</label>
        <input type="text" id="first-name">
      </div>

      <div>
        <label for="last-name">Last name</label>
        <input type="text" id="last-name">
      </div>

      <div>
        <label for="email">Email</label>
        <input type="text" id="email">
      </div>

      <div>
        <label for="number-of-tickets">Number of Tickets</label>
        <input type="text" id="number-of-tickets">
      </div>
    </form>
  </main>

  <footer></footer>
  
</body>
</html>
