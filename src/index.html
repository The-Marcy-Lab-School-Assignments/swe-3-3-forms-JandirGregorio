<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <title>RSVP Form</title>
</head>
<body>
  <header>
    <!-- Page's title -->
    <h1>NYC Tech Summit 2026</h1>
    <p>March 15, 2026 | 9:00 AM - 5:00 PM | Manhattan Conference Center</p>
  </header>

  <main>
    <!-- Form Section -->
    <form action="https://formspree.io/f/xdaalype" method="POST">
      <h2>Event RSVP</h2>
      <div class="form-row">
        <div class="form-field">
          <label for="first-name">First Name</label>
          <input type="text" id="first-name" name="firstName" required>
        </div>
        
        <div class="form-field">
          <label for="last-name">Last name</label>
          <input type="text" id="last-name" name="lastName" required>
        </div>
      </div>
    
      <div class="form-row">
        <div class="form-field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required>
        </div>
        
        <div class="form-field">
          <label for="number-of-tickets">Number of Tickets</label>
          <input type="number" id="number-of-tickets" name="numberOfTickets" min="1" max="4" step="1" required>
        </div>
      </div>

      <!-- Radio section -->
      <fieldset class="radio-group">
        <legend>Lunch Preference</legend>
        <div class="radio-option">
          <input type="radio" name="preference" id="preference-chicken" value="chicken" required>
          <label for="preference-chicken">Chicken</label>
        </div>
        <div class="radio-option">
          <input type="radio" name="preference" id="preference-fish" value="fish">
          <label for="preference-fish">Fish</label> 
        </div>
        <div class="radio-option">
          <input type="radio" name="preference" id="preference-vegetarian" value="vegetarian">
          <label for="preference-vegetarian">Vegetarian</label>
        </div>
      </fieldset>

      <!-- Checkbox section -->
      <fieldset class="checkbox-group">

        <legend>Select Workshop Sessions (Check all that apply)</legend>
        <div class="checkbox-field">
          <input type="checkbox" id="session-1" name="session" value="session1">
          <label for="session-1">Session 1</label>
        </div>
        <div class="checkbox-field">
          <input type="checkbox" id="session-2" name="session" value="session2">
          <label for="session-2">Session 2</label>
        </div>
        <div class="checkbox-field">
          <input type="checkbox" id="session-3" name="session" value="session3">
          <label for="session-3">Session 3</label>
        </div>
        <div class="checkbox-field">
          <input type="checkbox" id="session-4" name="session" value="session4">
          <label for="session-4">Session 4</label>
        </div>
        <div class="checkbox-field">
          <input type="checkbox" id="session-5" name="session" value="session5">
          <label for="session-5">Session 5</label>
        </div>
      </fieldset>
        

      <!-- Textarea section-->
      <div class="form-field">
        <label for="special-request-notes">Special Request or Notes</label>
        <textarea name="specialRequestNotes" id="special-request-notes" rows="5" cols="40" placeholder="Dietary restrictions, accessibility needs, questions, etc."></textarea>
      </div>
      <button type="submit">Complete RSVP</button>
     </form>
  </main>

  <footer>
    <p>Copyright © 2026 NYC Tech Summit</p>
  </footer>
  
</body>
</html>
